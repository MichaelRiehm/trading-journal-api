name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Branch protection on main requires this check by its name: "ci".
    name: ci
    runs-on: ubuntu-24.04
    # A real Postgres for the integration tests. They create, migrate and drop their
    # own journal_test database on this server.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal-ci-password
          POSTGRES_DB: journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journal -d journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://journal:journal-ci-password@127.0.0.1:5432/journal
    # Actions are pinned to full commit SHAs: a tag can be moved to different code, a SHA cannot.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-python: true

      - name: Install Python (version from .python-version)
        run: uv python install

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test

  # The runtime image builds, runs as non-root, and stays small (ADR 0015).
  image:
    name: image
    runs-on: ubuntu-24.04
    env:
      IMAGE: trading-journal-api:ci
      MAX_IMAGE_MB: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --tag "$IMAGE" .

      - name: Runs as a non-root user and imports the app
        run: |
          uid=$(docker run --rm "$IMAGE" id -u)
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
          docker run --rm "$IMAGE" python -c "import trading_journal.main"

      - name: Size budget
        run: |
          size_mb=$(( $(docker image inspect "$IMAGE" --format '{{.Size}}') / 1024 / 1024 ))
          echo "Image size: ${size_mb} MB (budget ${MAX_IMAGE_MB} MB)"
          test "$size_mb" -le "$MAX_IMAGE_MB"
