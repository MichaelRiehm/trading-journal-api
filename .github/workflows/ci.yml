name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Branch protection on main requires this check by its name: "ci".
    name: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.0"
          enable-cache: true
          cache-python: true

      - name: Install Python (version from .python-version)
        run: uv python install

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test
